<div class="layout-shell">
  <a class="skip-link" [href]="'#' + mainId">Ir para o conteúdo</a>
  <header class="site-header">
    <div class="page-container header-inner">
      <a class="portal-mark" routerLink="/" [attr.aria-label]="portalLabel + ', início'">{{ portalLabel }}</a>
      <button
        class="menu-toggle"
        type="button"
        aria-controls="portal-menu"
        [attr.aria-expanded]="menuOpen"
        aria-label="Abrir menu principal"
        (click)="toggleMenu()"
      >
        <span class="menu-toggle-icon" aria-hidden="true">☰</span>
        <span>Menu</span>
      </button>
      <nav id="portal-menu" class="portal-menu" [class.is-open]="menuOpen" aria-label="Navegação principal">
        <ul class="primary-navigation">
          @for (item of navigation; track item.href) {
            <li>
              <a
                [routerLink]="item.href"
                routerLinkActive="is-active"
                #activeLink="routerLinkActive"
                [routerLinkActiveOptions]="{ exact: true }"
                [attr.aria-current]="activeLink.isActive ? 'page' : null"
                [attr.data-active]="activeLink.isActive ? 'true' : null"
                (click)="closeMenu()"
              >{{ item.label }}</a>
            </li>
          }
        </ul>
      </nav>
      <div class="header-actions">
        <button class="action-link" type="button" data-layout-action="search" [attr.aria-label]="searchLabel">Buscar</button>
        <a class="button button-primary" routerLink="/inscricao">Começar</a>
        <button class="action-link logout-link" type="button" (click)="logout()">Sair</button>
      </div>
    </div>
  </header>
  <main [id]="mainId" class="page-container page-main" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
  <footer class="site-footer">
    <div class="page-container footer-inner">
      <p>{{ footerDescription }}</p>
      <nav aria-label="Links complementares">
        @for (link of footerLinks; track link.href + link.label) {
          <a [routerLink]="link.href">{{ link.label }}</a>
        }
      </nav>
    </div>
  </footer>
</div>
