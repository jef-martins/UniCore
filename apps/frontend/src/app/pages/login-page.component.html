<main class="auth-page" aria-labelledby="login-title">
  <section class="auth-card card card-elevated">
    <p class="hero-eyebrow">Portal UniCore</p>
    <h1 id="login-title">Acessar o Portal UniCore</h1>
    <p class="auth-description">Entre com seu usuário ou e-mail para acessar as ferramentas autorizadas para o seu perfil.</p>

    <form class="auth-form" (submit)="submit($event)">
      <div class="field">
        <label class="field-label" for="login-username">Usuário ou e-mail</label>
        <input
          id="login-username"
          class="field-control"
          type="text"
          autocomplete="username"
          required
          [value]="username"
          (input)="onUsernameInput($event)"
        />
      </div>
      <div class="field">
        <label class="field-label" for="login-password">Senha</label>
        <input
          id="login-password"
          class="field-control"
          type="password"
          autocomplete="current-password"
          required
          [value]="password"
          (input)="onPasswordInput($event)"
        />
      </div>
      @if (errorMessage) {
        <div class="alert" [style.color]="isEmailNotVerified ? 'var(--color-warning, #f59e0b)' : 'var(--color-danger, #ef4444)'" [style.background]="isEmailNotVerified ? 'rgba(245, 158, 11, 0.12)' : 'rgba(239, 68, 68, 0.1)'" style="padding: 1rem; border-radius: 8px; margin: 1rem 0; border: 1px solid currentColor;">
          <p style="margin: 0; font-weight: 500; line-height: 1.4;">{{ errorMessage }}</p>
          @if (isEmailNotVerified) {
            <div style="margin-top: 0.6rem;">
              <button class="button button-outline" type="button" (click)="resendLink()" [disabled]="isResending" style="font-size: 0.85rem; padding: 0.4rem 0.8rem; cursor: pointer;">
                {{ isResending ? 'Enviando...' : '✉️ Reenviar link de validação' }}
              </button>
            </div>
          }
        </div>
      }

      @if (resendSuccessMessage) {
        <div class="alert" style="color: var(--color-success, #10b981); background: rgba(16, 185, 129, 0.1); padding: 0.75rem 1rem; border-radius: 8px; margin: 0.75rem 0; border: 1px solid currentColor;">
          {{ resendSuccessMessage }}
        </div>
      }
      <button class="button button-primary auth-submit" type="submit" [disabled]="loginInProgress">
        {{ loginInProgress ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </section>
</main>
